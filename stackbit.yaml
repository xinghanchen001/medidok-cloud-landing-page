stackbitVersion: ~0.6.0
ssgName: custom
nodeVersion: '18'

# Für die lokale Entwicklung
devCommand: npm run dev
# Für den Build auf Netlify
buildCommand: npm run build || echo 'No build needed'

assets:
  referenceType: static
  publicPath: /
  staticDir: ./

contentSources:
  - name: pages
    label: Pages
    driver:
      type: files
      location: content
    schema:
      path: schemas/pages.yaml

models:
  page:
    type: page
    label: Page
    urlPath: /{slug}
    filePath: content/{slug}.md
    fields:
      - type: string
        name: title
        label: Title
        required: true
      - type: string
        name: slug
        label: Slug
        required: true
      - type: object
        name: hero
        label: Hero Section
        fields:
          - type: string
            name: heading
            label: Heading
          - type: string
            name: subheading
            label: Subheading
          - type: string
            name: buttonText
            label: Button Text
          - type: string
            name: buttonLink
            label: Button Link
      - type: list
        name: features
        label: Features
        items:
          type: object
          fields:
            - type: string
              name: title
              label: Title
            - type: string
              name: description
              label: Description
            - type: string
              name: icon
              label: Icon Name
      - type: markdown
        name: content
        label: Content

pageLayouts:
  - content/index.md
  - content/about.md
  - content/features.md
  - content/contact.md 