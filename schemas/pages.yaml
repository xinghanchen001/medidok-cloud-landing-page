title: Pages
models:
  page:
    type: page
    label: Page
    fields:
      - type: string
        name: title
        label: Title
        required: true
      - type: string
        name: slug
        label: Slug
        required: true
      - type: object
        name: hero
        label: Hero Section
        fields:
          - type: string
            name: heading
            label: Heading
          - type: string
            name: subheading
            label: Subheading
          - type: string
            name: buttonText
            label: Button Text
          - type: string
            name: buttonLink
            label: Button Link
      - type: list
        name: features
        label: Features
        items:
          type: object
          fields:
            - type: string
              name: title
              label: Title
            - type: string
              name: description
              label: Description
            - type: string
              name: icon
              label: Icon Name
      - type: markdown
        name: content
        label: Content 